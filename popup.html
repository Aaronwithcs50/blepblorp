<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docs Detail Refiner</title>
    <style>
      body {
        font-family: Inter, Arial, sans-serif;
        margin: 0;
        padding: 16px;
        width: 360px;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 10px;
      }
      .hint {
        font-size: 12px;
        color: #475569;
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin: 8px 0 4px;
      }
      input,
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 8px;
      }
      input,
      textarea {
        border: 1px solid #cbd5e1;
        padding: 8px;
        background: #fff;
      }
      textarea {
        min-height: 64px;
        resize: vertical;
      }
      button {
        border: none;
        margin-top: 12px;
        padding: 10px 12px;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .small {
        font-size: 11px;
        color: #64748b;
        margin-top: 8px;
      }
      pre {
        font-size: 11px;
        background: #0f172a;
        color: #e2e8f0;
        padding: 8px;
        border-radius: 8px;
        max-height: 100px;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Docs Detail Refiner</h1>
    <p class="hint">
      Open a Google Doc tab first, then click <strong>Refine Current Doc</strong>.
    </p>

    <label for="googleClientId">Google OAuth Client ID</label>
    <input id="googleClientId" placeholder="...apps.googleusercontent.com" />

    <label for="openAiKey">OpenAI API Key (optional)</label>
    <input id="openAiKey" type="password" placeholder="sk-..." />

    <label for="focusPrompt">Focus (optional)</label>
    <textarea id="focusPrompt" placeholder="Example: Make tone more executive and add implementation detail."></textarea>

    <button id="runButton">Refine Current Doc</button>
    <p class="small">This app appends an "AI Detail Pass" section and chart(s) at the end of your doc.</p>
    <pre id="log"></pre>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="popup.js"></script>
  </body>
</html>
